<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Directive">
<meta name="theme-color" content="#040a07">
<title>The Directive</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23040a07'/%3E%3Ccircle cx='90' cy='90' r='44' fill='none' stroke='%233bff9e' stroke-width='7'/%3E%3Ccircle cx='90' cy='90' r='15' fill='%234ad9ff'/%3E%3Cpath d='M90 26v18M90 136v18M26 90h18M136 90h18' stroke='%233bff9e' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --g:#3bff9e; --g2:#1a7a4d; --g3:#0d3d28; --bg:#040a07;
    --amb:#ffb347; --b:#4ad9ff; --red:#ff6b6b;
  }
  *{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg)}
  body{color:var(--g);font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:16px;line-height:1.4;
    padding:max(14px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));
    -webkit-user-select:none;user-select:none;overflow-x:hidden}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,.26) 0 1px,transparent 1px 3px)}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
  :focus-visible{outline:1px solid var(--b);outline-offset:2px}

  .bar{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:9px;letter-spacing:.18em;
    border-bottom:1px solid var(--g3);padding-bottom:8px;margin-bottom:12px}
  .bar .id{color:var(--g);text-shadow:0 0 8px rgba(59,255,158,.55)}
  .bar .st{color:var(--g2);flex:0 0 auto;white-space:nowrap}
  .blink{animation:bl 1.1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  .nav{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .navb{border:1px solid var(--g3);width:26px;height:22px;display:flex;align-items:center;justify-content:center;
    font-size:9px;color:var(--b);transition:.1s;flex:0 0 auto}
  .navb:active{background:var(--g);border-color:var(--g);color:var(--bg)}
  .navb[disabled]{color:var(--g3);border-color:var(--g3);opacity:.45}
  .backnote{display:none;margin:0 0 10px;padding:6px 8px;border:1px solid var(--amb);
    font-size:8px;letter-spacing:.14em;color:var(--amb)}
  .backnote.show{display:block}
  .backnote button{color:var(--b);font-size:8px;letter-spacing:.14em;text-decoration:underline}
  body.past .bar{border-bottom-color:var(--amb)}
  body.past .bar .st{color:var(--amb)}
  .cap{font-size:8.5px;letter-spacing:.2em;color:var(--g2);margin:0 0 6px}
  .cap::before{content:'> '}

  /* visual block */
  .visual{display:flex;gap:5px}
  .hero{position:relative;flex:1;height:172px;border:1px solid var(--g3);overflow:hidden;display:block;
        background:rgba(59,255,158,.03) center/cover no-repeat}
  .hero input,.shot input{display:none}
  .hero .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
            font-size:8.5px;letter-spacing:.16em;color:var(--b)}
  .hero .tint{position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(4,10,7,.92));pointer-events:none}
  .hero .msg{position:absolute;left:0;right:0;bottom:0;padding:8px 9px;font-size:10px;line-height:1.5;
             color:var(--g);text-shadow:0 0 8px rgba(59,255,158,.4);z-index:2}
  .hero .msg::before{content:'// ';color:var(--g2)}
  .shots{display:flex;flex-direction:column;gap:5px;width:66px;flex:0 0 auto}
  .shot{position:relative;flex:1;border:1px solid var(--g3);overflow:hidden;display:flex;align-items:center;
        justify-content:center;font-size:7.5px;letter-spacing:.1em;color:var(--b);
        background:rgba(59,255,158,.03) center/cover no-repeat;text-align:center}

  /* metrics */
  .m{border:1px solid var(--g3);padding:8px 9px;margin-top:6px;overflow:hidden}
  .m .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .m .lab{font-size:8.5px;letter-spacing:.14em;color:var(--g2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .m .src{font-size:7px;color:var(--b);letter-spacing:.1em;flex:0 0 auto}
  .m .row{display:flex;align-items:center;gap:8px;margin-top:5px}
  .m .val{font-size:16px;color:var(--g);text-shadow:0 0 8px rgba(59,255,158,.4);
          flex:0 0 74px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .m .val.zero{color:var(--g3);text-shadow:none}
  .m .cells{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;flex:1}
  .m .cl{height:14px;border:1px solid var(--g3)}
  .m .cl.f{background:var(--g);border-color:var(--g);box-shadow:0 0 7px rgba(59,255,158,.45)}
  .m .cl.f.over{background:var(--amb);border-color:var(--amb);box-shadow:0 0 7px rgba(255,179,71,.45)}
  .m .btns{display:flex;gap:4px;flex:0 0 auto}
  .cb{border:1px solid var(--g3);width:32px;height:30px;display:flex;align-items:center;justify-content:center;
      font-size:15px;color:var(--g2);transition:.1s}
  .cb:active{background:var(--g);border-color:var(--g);color:var(--bg)}

  /* anchors */
  .anch{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
  .an{border:1px solid var(--g3);padding:9px 1px;text-align:center;transition:.15s;overflow:hidden}
  .an .n{display:block;font-size:8.5px;letter-spacing:.02em;color:var(--b);text-shadow:0 0 7px rgba(74,217,255,.3)}
  .an .s{display:block;font-size:6.5px;letter-spacing:.08em;color:var(--g3);margin-top:2px}
  .an.on{background:var(--g);border-color:var(--g);box-shadow:0 0 14px rgba(59,255,158,.4)}
  .an.on .n{color:var(--bg);text-shadow:none}
  .an.on .s{color:rgba(4,10,7,.6)}
  .an:not(.on):active{background:rgba(59,255,158,.12)}

  /* month */
  .strip{display:grid;grid-template-columns:repeat(31,1fr);gap:2px;width:100%}
  .sc{height:16px;border:1px solid var(--g3);background:transparent;padding:0;cursor:pointer;display:block;width:100%}
  .sc.today{border-color:var(--b)}
  .sc.viewing{outline:1px solid var(--amb);outline-offset:1px}
  .srow{display:flex;justify-content:space-between;font-size:7px;color:var(--g3);margin-top:4px;letter-spacing:.08em}

  .ftr{display:flex;justify-content:space-between;gap:6px;font-size:8.5px;letter-spacing:.1em;color:var(--g2);
    margin-top:12px;border-top:1px solid var(--g3);padding-top:10px;overflow:hidden}
  .ftr span,.ftr button{white-space:nowrap}
  .ftr button{color:var(--b);font-size:8.5px;letter-spacing:.1em}

  .sheet{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;gap:12px;
    padding:calc(env(safe-area-inset-top) + 54px) 14px calc(env(safe-area-inset-bottom) + 24px);
    z-index:40;overflow:auto;-webkit-overflow-scrolling:touch}
  .sheet.open{display:flex}
  .sheet h2{font-size:10px;letter-spacing:.22em;margin:0;color:var(--g);font-weight:400}
  .sheet .close{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;z-index:45;
    width:40px;height:36px;display:flex;align-items:center;justify-content:center;
    font-size:18px;color:var(--b);border:1px solid var(--g3);background:var(--bg)}
  .sheet .close:active{background:var(--g);border-color:var(--g);color:var(--bg)}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  .acts button{border:1px solid var(--g3);color:var(--b);padding:10px 13px;font-size:9px;letter-spacing:.14em}
  .acts button:active{background:var(--g);border-color:var(--g);color:var(--bg)}
  .acts button.danger{color:var(--red)}
  table{width:100%;border-collapse:collapse;font-size:10px}
  th{color:var(--g3);font-weight:400;text-align:right;padding:6px 2px;border-bottom:1px solid var(--g3);
     letter-spacing:.08em;font-size:7.5px}
  th:first-child,td:first-child{text-align:left}
  td{text-align:right;padding:6px 2px;border-bottom:1px dotted var(--g3);color:var(--amb)}
  td:first-child{color:var(--g)}
  .tip{font-size:8.5px;color:var(--g3);line-height:1.7;letter-spacing:.06em}

  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(18px);
    background:var(--g);color:var(--bg);padding:9px 18px;font-size:9px;letter-spacing:.2em;
    opacity:0;transition:.2s;pointer-events:none;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="bar">
  <span class="id">DIRECTIVE</span>
  <span class="nav">
    <button class="navb" id="prevDay" aria-label="Previous day">&#9664;</button>
    <span class="st" id="stamp">&#9608;</span>
    <button class="navb" id="nextDay" aria-label="Next day">&#9654;</button>
  </span>
</div>
<p class="backnote" id="backnote">&#9679; EDITING PAST RECORD &mdash; <button id="toToday">RETURN TO NOW</button></p>

<div class="visual">
  <label class="hero" id="hero">
    <input type="file" accept="image/*">
    <span class="ph" id="heroPh">[ SET GOAL IMAGE ]</span>
    <span class="tint"></span>
    <span class="msg" id="msg"></span>
  </label>
  <div class="shots">
    <label class="shot" id="shotA"><input type="file" accept="image/*"><span>BASELINE</span></label>
    <label class="shot" id="shotB"><input type="file" accept="image/*" capture="user"><span>CURRENT</span></label>
  </div>
</div>

<p class="cap" style="margin-top:13px;">METRICS</p>
<div id="metrics"></div>

<p class="cap" style="margin-top:13px;">SQT ANCHORS</p>
<div class="anch" id="anchors"></div>

<p class="cap" style="margin-top:13px;">31 DAY TRACE</p>
<div class="strip" id="strip"></div>
<div class="srow"><span id="stripA"></span><span id="stripB"></span></div>

<div class="ftr">
  <span id="dayPct">0%</span>
  <span id="streakTxt">&mdash;</span>
  <button id="openHist">ARCHIVE</button>
  <button id="openExp">DUMP &#8681;</button>
</div>

<div class="sheet" id="sheet">
  <button class="close" id="closeSheet" aria-label="Close">&#10005;</button>
  <h2 id="sheetTitle">ARCHIVE</h2>
  <div class="acts">
    <button id="exportBtn">EXPORT CSV</button>
    <button id="copyBtn">COPY CSV</button>
    <button id="clearBtn" class="danger">CLEAR THIS DAY</button>
  </div>
  <p class="tip" id="lastExport"></p>
  <div id="sheetBody"></div>
  <p class="tip">LOCAL STORAGE ONLY &mdash; NOTHING TRANSMITTED.<br>EXPORT PERIODICALLY; A BROWSER PURGE CAN CLEAR THIS DEVICE.</p>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var KEY='directive.console.v1';

  function hm(v){ return Math.floor(v/60)+'h'+String(v%60).padStart(2,'0'); }
  function mins(v){ return v+'m'; }
  function pad(n,w){ return String(n).padStart(w||2,'0'); }
  function dkey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

  var METRICS=[
    {id:'steps',    label:'STEPS',    step:500, goal:15000, fmt:function(v){return v.toLocaleString();}, hint:'500', auto:true},
    {id:'sleep',    label:'SLEEP',    step:15,  goal:480,   fmt:hm,   hint:'15m', auto:true},
    {id:'calories', label:'CALORIES', step:100, goal:2200,  fmt:function(v){return v.toLocaleString();}, hint:'100'},
    {id:'gym',      label:'GYM',      step:15,  goal:60,    fmt:mins, hint:'15m'},
    {id:'basilisk', label:'BASILISK', step:15,  goal:60,    fmt:mins, hint:'15m'},
    {id:'stretch',  label:'STRETCH',  step:10,  goal:20,    fmt:mins, hint:'10m'}
  ];
  var ANCHORS=[
    {id:'arrival',  n:'ARRIVAL',  s:'INIT'},
    {id:'t0900',    n:'09:00',    s:'FWD'},
    {id:'t1200',    n:'12:00',    s:'MID'},
    {id:'t1400',    n:'14:00',    s:'INV'},
    {id:'departure',n:'DEPART',   s:'CLOSE'}
  ];

  var MESSAGES=[
    "The body you are building already exists. It is running backward to meet you here.",
    "You did not decide today. The decision was made at the far end and arrived on schedule.",
    "Two arms close on this hour: the one that started, the one that finished. You stand where they meet.",
    "What has happened, happened. The form was already constructed; you are only catching up to it.",
    "You don't have to picture it. It is already picturing you.",
    "Entropy ran the other way this morning. The coffee brewed, and the work was already done.",
    "You missed one. The inverted arm absorbed it before you noticed. The week held.",
    "Do not try to want it. Execute the cue and let causality sort itself out.",
    "Rūpa is assembled, not wished for. One anchor, then the next. That is the whole construction.",
    "Somewhere at the end of this, a finished body remembers today going exactly like this."
  ];

  var store={days:{},images:{},lastExport:null};
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){ store=JSON.parse(raw); store.days=store.days||{}; store.images=store.images||{}; }
  }catch(e){ console.warn('read failed',e); }

  var saveTimer=null;
  function save(){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(function(){
      try{ localStorage.setItem(KEY,JSON.stringify(store)); }
      catch(e){ toast('SAVE FAILED'); console.warn(e); }
    },100);
  }

  var today=dkey(new Date());
  var viewKey=today;
  function day(){
    if(!store.days[viewKey]) store.days[viewKey]={steps:0,sleep:0,calories:0,gym:0,basilisk:0,stretch:0,squats:[]};
    var d=store.days[viewKey];
    if(!Array.isArray(d.squats)) d.squats=[];
    return d;
  }
  function parseKey(k){ var p=k.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }

  var DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  var MONS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  function stampDate(){
    var d=parseKey(viewKey), isNow=(viewKey===today);
    document.getElementById('stamp').innerHTML=
      DAYS[d.getDay()]+' '+pad(d.getDate())+' '+MONS[d.getMonth()]+
      (isNow?' <span class="blink">\u2588</span>':'');
    document.body.classList.toggle('past',!isNow);
    document.getElementById('backnote').classList.toggle('show',!isNow);
    document.getElementById('nextDay').disabled=isNow;
  }

  var toastEl=document.getElementById('toast'), tTimer=null;
  function toast(m){
    toastEl.textContent=m; toastEl.classList.add('show');
    clearTimeout(tTimer); tTimer=setTimeout(function(){ toastEl.classList.remove('show'); },1500);
  }
  function buzz(){ if(navigator.vibrate) navigator.vibrate(8); }

  // ---- message ----
  var seed=Math.floor(Date.now()/864e5);
  var msgEl=document.getElementById('msg');
  msgEl.textContent=MESSAGES[seed%MESSAGES.length];
  msgEl.addEventListener('click',function(e){
    e.preventDefault(); e.stopPropagation();
    seed++; msgEl.textContent=MESSAGES[seed%MESSAGES.length];
  });

  // ---- images ----
  function shrink(file,maxW,cb){
    var r=new FileReader();
    r.onload=function(){
      var img=new Image();
      img.onload=function(){
        var sc=Math.min(1,maxW/img.width);
        var c=document.createElement('canvas');
        c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        cb(c.toDataURL('image/jpeg',0.72));
      };
      img.onerror=function(){ cb(r.result); };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  }
  function wire(el,slot,maxW){
    function show(url){
      el.style.backgroundImage='url('+url+')';
      el.style.borderColor='var(--g2)';
      [].forEach.call(el.children,function(ch){
        if(ch.tagName!=='INPUT' && !ch.classList.contains('msg') && !ch.classList.contains('tint'))
          ch.style.display='none';
      });
    }
    if(store.images[slot]) show(store.images[slot]);
    var inp=el.querySelector('input');
    inp.addEventListener('change',function(){
      var f=inp.files && inp.files[0];
      if(!f) return;
      shrink(f,maxW,function(url){
        var prev=store.images[slot];
        store.images[slot]=url;
        try{ localStorage.setItem(KEY,JSON.stringify(store)); show(url); }
        catch(e){ store.images[slot]=prev; toast('IMAGE TOO LARGE'); }
      });
    });
  }
  wire(document.getElementById('hero'),'hero',900);
  wire(document.getElementById('shotA'),'shotA',420);
  wire(document.getElementById('shotB'),'shotB',420);

  // ---- metrics ----
  var wrap=document.getElementById('metrics');
  var painters={};
  function hold(el,fn){
    var timer=null,n=0;
    function start(e){
      if(e.cancelable) e.preventDefault();
      fn(1); buzz(); n=0;
      timer=setInterval(function(){ n++; fn(n>12?5:(n>6?2:1)); },150);
    }
    function stop(){ clearInterval(timer); timer=null; }
    el.addEventListener('touchstart',start,{passive:false});
    el.addEventListener('touchend',stop); el.addEventListener('touchcancel',stop);
    el.addEventListener('mousedown',start); el.addEventListener('mouseup',stop); el.addEventListener('mouseleave',stop);
  }
  METRICS.forEach(function(m){
    var el=document.createElement('div');
    el.className='m';
    var cells='';
    for(var i=0;i<10;i++) cells+='<span class="cl"></span>';
    el.innerHTML=
      '<div class="top"><span class="lab">'+m.label+'</span>'+
        '<span class="src">'+(m.auto?'HEALTH \u00B7 \u00B1'+m.hint:'\u00B1'+m.hint)+'</span></div>'+
      '<div class="row">'+
        '<span class="val zero"></span>'+
        '<span class="cells">'+cells+'</span>'+
        '<span class="btns"><button class="cb" aria-label="Decrease '+m.label+'">&minus;</button>'+
        '<button class="cb" aria-label="Increase '+m.label+'">+</button></span>'+
      '</div>';
    wrap.appendChild(el);
    var val=el.querySelector('.val'), cls=el.querySelectorAll('.cl'), btns=el.querySelectorAll('.cb');
    painters[m.id]=function(){
      var v=day()[m.id]||0;
      val.textContent=m.fmt(v);
      val.classList.toggle('zero',v===0);
      var filled=Math.min(10,Math.floor(v/m.goal*10));
      var over=v>=m.goal;
      [].forEach.call(cls,function(c,i){
        c.className='cl'+(i<filled?' f':'')+(over&&i<filled?' over':'');
      });
    };
    function bump(dir,mult){
      var d=day();
      d[m.id]=Math.max(0,(d[m.id]||0)+dir*m.step*(mult||1));
      painters[m.id](); paintStrip(); paintFoot(); save();
    }
    hold(btns[0],function(n){ bump(-1,n); });
    hold(btns[1],function(n){ bump(1,n); });
    painters[m.id]();
  });

  // ---- anchors ----
  var aw=document.getElementById('anchors');
  var anchorPainters=[];
  ANCHORS.forEach(function(a){
    var b=document.createElement('button');
    b.className='an'; b.setAttribute('aria-pressed','false');
    b.innerHTML='<span class="n">'+a.n+'</span><span class="s">'+a.s+'</span>';
    b.addEventListener('click',function(){
      var list=day().squats, i=list.indexOf(a.id);
      if(i>-1) list.splice(i,1); else list.push(a.id);
      paintAnchor(); paintStrip(); paintFoot(); save(); buzz();
    });
    function paintAnchor(){
      var on=day().squats.indexOf(a.id)>-1;
      b.classList.toggle('on',on);
      b.setAttribute('aria-pressed',on?'true':'false');
    }
    anchorPainters.push(paintAnchor);
    aw.appendChild(b);
    paintAnchor();
  });
  function paintAnchors(){ anchorPainters.forEach(function(f){ f(); }); }

  // ---- completion ----
  function completion(rec){
    if(!rec) return 0;
    var got=0, total=METRICS.length+1;
    METRICS.forEach(function(m){ if((rec[m.id]||0)>=m.goal) got++; });
    if((rec.squats||[]).length>=5) got++;
    return got/total;
  }

  // ---- 31 day strip ----
  var start=new Date(); start.setDate(start.getDate()-30);
  var strip=document.getElementById('strip'), cellEls=[], cellKeys=[];
  for(var i=0;i<31;i++){
    var d=new Date(start); d.setDate(start.getDate()+i);
    var k=dkey(d);
    var c=document.createElement('button');
    c.className='sc'+(k===today?' today':'');
    c.setAttribute('aria-label','View '+k);
    (function(k){ c.addEventListener('click',function(){ goto(k); buzz(); }); })(k);
    strip.appendChild(c); cellEls.push(c); cellKeys.push(k);
  }
  document.getElementById('stripA').textContent=cellKeys[0].slice(5).replace('-','/');
  document.getElementById('stripB').textContent=cellKeys[30].slice(5).replace('-','/');
  function paintStrip(){
    cellEls.forEach(function(c,i){
      c.classList.toggle('viewing',cellKeys[i]===viewKey && viewKey!==today);
      var p=completion(store.days[cellKeys[i]]);
      if(p>0){
        c.style.background='var(--g)';
        c.style.borderColor='var(--g)';
        c.style.opacity=(0.28+p*0.72).toFixed(2);
      } else {
        c.style.background='transparent';
        c.style.borderColor=cellKeys[i]===today?'var(--b)':'var(--g3)';
        c.style.opacity='1';
      }
    });
  }

  function paintFoot(){
    document.getElementById('dayPct').textContent=
      Math.round(completion(day())*100)+'% '+(viewKey===today?'TODAY':viewKey.slice(5).replace('-','/'));
    var n=0;
    for(var i=cellKeys.length-1;i>=0;i--){
      if(completion(store.days[cellKeys[i]])>0) n++; else break;
    }
    document.getElementById('streakTxt').textContent=n?n+' DAY RUN':'NO RUN';
  }

  // ---- CSV ----
  function csv(){
    var head=['date','steps','sleep_minutes','calories','gym_minutes','basilisk_minutes','stretch_minutes','squat_sets','squat_anchors'];
    var out=[head.join(',')];
    Object.keys(store.days).sort().forEach(function(k){
      var r=store.days[k];
      out.push([k,r.steps||0,r.sleep||0,r.calories||0,r.gym||0,r.basilisk||0,r.stretch||0,
                (r.squats||[]).length,'"'+(r.squats||[]).join(' ')+'"'].join(','));
    });
    return out.join('\n');
  }

  // ---- sheet ----
  var sheet=document.getElementById('sheet');
  function open(title,html){
    document.getElementById('sheetTitle').textContent=title;
    document.getElementById('sheetBody').innerHTML=html;
    document.getElementById('lastExport').textContent=
      store.lastExport ? 'LAST EXPORT: '+store.lastExport : 'NEVER EXPORTED';
    sheet.classList.add('open');
  }
  document.getElementById('closeSheet').addEventListener('click',function(){ sheet.classList.remove('open'); });

  function histHTML(){
    var keys=Object.keys(store.days).sort().reverse();
    if(!keys.length) return '<p class="tip">NO RECORDS</p>';
    var h='<table><tr><th>DATE</th><th>STEP</th><th>SLP</th><th>CAL</th><th>GYM</th><th>BAS</th><th>STR</th><th>SQ</th></tr>';
    keys.forEach(function(k){
      var r=store.days[k];
      h+='<tr><td>'+k.slice(5)+'</td><td>'+(r.steps||0).toLocaleString()+'</td><td>'+hm(r.sleep||0)+
         '</td><td>'+(r.calories||0)+'</td><td>'+(r.gym||0)+'</td><td>'+(r.basilisk||0)+
         '</td><td>'+(r.stretch||0)+'</td><td>'+((r.squats||[]).length)+'</td></tr>';
    });
    return h+'</table>';
  }
  document.getElementById('openHist').addEventListener('click',function(){ open('ARCHIVE',histHTML()); });
  document.getElementById('openExp').addEventListener('click',function(){ open('ARCHIVE',histHTML()); });

  document.getElementById('exportBtn').addEventListener('click',function(){
    if(!Object.keys(store.days).length){ toast('NOTHING TO EXPORT'); return; }
    var blob=new Blob([csv()],{type:'text/csv'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='directive-'+today+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
    store.lastExport=today; save();
    document.getElementById('lastExport').textContent='LAST EXPORT: '+today;
    toast('EXPORTED');
  });
  document.getElementById('copyBtn').addEventListener('click',function(){
    var text=csv();
    function ok(){ toast('COPIED'); }
    function fb(){
      var ta=document.createElement('textarea');
      ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); ok(); }catch(e){ toast('COPY FAILED'); }
      ta.remove();
    }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok,fb); }
    else fb();
  });
  document.getElementById('clearBtn').addEventListener('click',function(){
    if(!confirm('Clear all entries for '+viewKey+'?')) return;
    delete store.days[viewKey];
    METRICS.forEach(function(m){ painters[m.id](); });
    paintAnchors(); paintStrip(); paintFoot(); save();
    document.getElementById('sheetBody').innerHTML=histHTML();
    toast('RECORD CLEARED');
  });

  function goto(k){
    var limit=cellKeys[0];
    if(k<limit) k=limit;
    if(k>today) k=today;
    viewKey=k;
    stampDate();
    METRICS.forEach(function(m){ painters[m.id](); });
    paintAnchors(); paintStrip(); paintFoot();
  }
  function shift(n){
    var d=parseKey(viewKey); d.setDate(d.getDate()+n);
    goto(dkey(d)); buzz();
  }
  document.getElementById('prevDay').addEventListener('click',function(){ shift(-1); });
  document.getElementById('nextDay').addEventListener('click',function(){ shift(1); });
  document.getElementById('toToday').addEventListener('click',function(){ goto(today); buzz(); });

  setInterval(function(){ if(dkey(new Date())!==today && viewKey===today) location.reload(); },60000);
  document.addEventListener('gesturestart',function(e){ e.preventDefault(); });

  stampDate(); paintStrip(); paintFoot();
})();
</script>
</body>
</html>
